  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ht: 700;\n  font-display: swap;\n  src: url(\"54c619a4-5309-4213-9ee8-8505e5cd31b2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* devanagari */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"56882d59-a8ea-4175-9e0e-3ed1da77015f\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"93b648ac-d37e-449e-a482-e574d9dcbf6d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"a072357a-5d78-46c8-81d4-3b281626034a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---- PRIMARY ----------------------------------------------- */\n  --signal-red:      #FF585D;   /* Primary brand color  - CTAs, accents */\n\n  /* ---- SECONDARY --------------------------------------------- */\n  --neptune:         #6446FF;   /* Trust, creativity, innovation */\n  --digitalis:       #AF46B4;   /* Innovation, ambition, creativity */\n\n  /* ---- TERTIARY ---------------------------------------------- */\n  --seafoam:         #82DCBE;   /* Positive / success in charts */\n  --coral:           #FFA0A0;   /* Soft accent / negative in charts */\n  --sunshine:        #FFC864;   /* Highlights / warning in charts */\n  --orange:          #FF705A;   /* Alerts / emphasis */\n\n  /* ---- NEUTRALS ---------------------------------------------- */\n  --warm-black:      #2F2F2F;   /* Text & deep backgrounds */\n  --soft-white:      #DFCFCA;   /* Warm cream alt to white */\n  --fog:             #F5F4EE;   /* Page background */\n  --pure-white:      #FFFFFF;\n\n  /* ---- CELESTIAL GRADIENT ------------------------------------ */\n  --celestial-gradient:\n      linear-gradient(120deg, #6446FF 0%, #AF46B4 50%, #FF585D 100%);\n  --celestial-gradient-vertical:\n      linear-gradient(180deg, #6446FF 0%, #AF46B4 50%, #FF585D 100%);\n  --celestial-gradient-radial:\n      radial-gradient(circle at 30% 20%, #6446FF 0%, #AF46B4 45%, #FF585D 100%);\n\n  /* ---- TINTS (10% / 20% backgrounds) ------------------------- */\n  --signal-red-10:   #FFE7E8;\n  --neptune-10:      #E7E2FF;\n  --digitalis-10:    #F4E2F6;\n  --seafoam-10:      #E6F8F1;\n\n  /* ============================================================\n     SEMANTIC TOKENS — light theme (default)\n     ============================================================ */\n  --bg:              var(--fog);\n  --bg-elevated:     var(--pure-white);\n  --bg-inset:        #ECEBE4;\n  --surface-warm:    var(--soft-white);\n\n  --fg:              var(--warm-black);\n  --fg-1:            var(--warm-black);\n  --fg-2:            #5C5C5C;\n  --fg-3:            #8A8A85;\n  --fg-on-red:       var(--fog);\n  --fg-on-gradient:  var(--fog);\n\n  --border:          #E4E2D9;\n  --border-strong:   #C9C6BB;\n  --divider:         #EBE9E0;\n\n  --accent:          var(--signal-red);\n  --accent-fg:       var(--fog);\n  --accent-hover:    #F04A4F;   /* slightly darker red for hover */\n  --accent-press:    #DA3F44;\n\n  --link:            var(--neptune);\n  --focus-ring:      #6446FF;\n\n  --success:         #4FB890;   /* derived from seafoam */\n  --warning:         #E5A53A;   /* derived from sunshine */\n  --danger:          var(--signal-red);\n  --info:            var(--neptune);\n\n  /* ============================================================\n     TYPOGRAPHY\n     ============================================================\n     Brand primary: Euclid Flex (bold / medium / light)\n     Google Docs/Slides substitute: Poppins (bold / regular)\n     PowerPoint substitute: Avenir Next LT Pro\n     This stack falls back through all approved options.       */\n  --font-display:    'Euclid Flex', 'Poppins', 'Avenir Next', 'Avenir', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n  --font-body:       'Euclid Flex', 'Poppins', 'Avenir Next', 'Avenir', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n  --font-mono:       'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  /* type scale (16px base, 1.25 modular scale) */\n  --t-display-1: 96px;\n  --t-display-2: 72px;\n  --t-h1:        56px;\n  --t-h2:        40px;\n  --t-h3:        28px;\n  --t-h4:        22px;\n  --t-h5:        18px;\n  --t-body-lg:   18px;\n  --t-body:      16px;\n  --t-body-sm:   14px;\n  --t-caption:   12px;\n  --t-eyebrow:   12px;\n\n  /* line heights */\n  --lh-display:  0.95;   /* tight leading for big headlines */\n  --lh-tight:    1.1;\n  --lh-snug:     1.25;\n  --lh-normal:   1.45;\n  --lh-loose:    1.65;\n\n  /* tracking — brand spec: headlines run at -10 (i.e. -0.01em-ish in CSS) */\n  --tracking-display: -0.03em;\n  --tracking-tight:   -0.015em;\n  --tracking-normal:  0;\n  --tracking-wide:    0.04em;\n  --tracking-caps:    0.08em;\n\n  /* weights */\n  --w-light:    300;\n  --w-regular:  400;\n  --w-medium:   500;\n  --w-semibold: 600;\n  --w-bold:     700;\n\n  /* ============================================================\n     SPACING / RADIUS / SHADOWS\n     ============================================================ */\n  --space-0:   0px;\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   24px;\n  --space-6:   32px;\n  --space-7:   48px;\n  --space-8:   64px;\n  --space-9:   96px;\n  --space-10: 128px;\n\n  --radius-xs:  4px;\n  --radius-sm:  8px;\n  --radius-md:  12px;\n  --radius-lg:  20px;\n  --radius-xl:  28px;\n  --radius-2xl: 40px;\n  --radius-pill: 999px;\n\n  --shadow-xs: 0 1px 2px rgba(47,47,47,.06);\n  --shadow-sm: 0 1px 3px rgba(47,47,47,.06), 0 1px 2px rgba(47,47,47,.04);\n  --shadow-md: 0 6px 18px rgba(47,47,47,.08), 0 2px 6px rgba(47,47,47,.04);\n  --shadow-lg: 0 18px 40px rgba(47,47,47,.10), 0 4px 12px rgba(47,47,47,.04);\n  --shadow-xl: 0 28px 60px rgba(47,47,47,.14), 0 10px 24px rgba(47,47,47,.06);\n  --shadow-glow-red:     0 8px 28px rgba(255,88,93,.32);\n  --shadow-glow-neptune: 0 8px 28px rgba(100,70,255,.30);\n\n  /* easing — brand is \"dynamic, contemporary\"; favour crisp out-curves */\n  --ease-out:        cubic-bezier(.22, 1, .36, 1);\n  --ease-in-out:     cubic-bezier(.65, 0, .35, 1);\n  --ease-spring:     cubic-bezier(.34, 1.56, .64, 1);\n  --dur-fast:        140ms;\n  --dur-base:        220ms;\n  --dur-slow:        420ms;\n}\n\n/* ============================================================\n   DARK THEME — warm black canvas\n   Apply via [data-theme=\"dark\"] or .theme-dark\n   ============================================================ */\n[data-theme=\"dark\"], .theme-dark {\n  --bg:           var(--warm-black);\n  --bg-elevated:  #3A3A3A;\n  --bg-inset:     #262626;\n  --surface-warm: #3A3733;\n\n  --fg:           var(--fog);\n  --fg-1:         var(--fog);\n  --fg-2:         #C9C6BB;\n  --fg-3:         #8A8A85;\n\n  --border:       #4A4744;\n  --border-strong:#6A6661;\n  --divider:      #3F3D3A;\n}\n\n/* ============================================================\n   SEMANTIC ELEMENT STYLES\n   ============================================================ */\n\nhtml, body {\n  font-family: var(--font-body);\n  font-weight: var(--w-light);\n  font-size: var(--t-body);\n  line-height: var(--lh-normal);\n  color: var(--fg);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n/* Headlines — Euclid Flex Bold, sentence case, tight leading, -10 tracking */\n.h-display-1,\n.h-display-2,\nh1, h2, h3, h4, h5 {\n  font-family: var(--font-display);\n  font-weight: var(--w-bold);\n  letter-spacing: var(--tracking-display);\n  line-height: var(--lh-display);\n  color: var(--fg-1);\n  text-wrap: balance;\n  margin: 0;\n}\n\n.h-display-1 { font-size: var(--t-display-1); line-height: var(--lh-display); }\n.h-display-2 { font-size: var(--t-display-2); line-height: var(--lh-display); }\nh1 { font-size: var(--t-h1); line-height: var(--lh-tight); }\nh2 { font-size: var(--t-h2); line-height: var(--lh-tight); letter-spacing: var(--tracking-tight); }\nh3 { font-size: var(--t-h3); line-height: var(--lh-snug); letter-spacing: var(--tracking-tight); }\nh4 { font-size: var(--t-h4); line-height: var(--lh-snug); letter-spacing: var(--tracking-tight); }\nh5 { font-size: var(--t-h5); line-height: var(--lh-snug); letter-spacing: var(--tracking-tight); }\n\n/* Subheads — medium weight, sentence case (CAPS only inside body copy runs) */\n.subhead {\n  font-family: var(--font-display);\n  font-weight: var(--w-medium);\n  font-size: var(--t-h5);\n  line-height: var(--lh-snug);\n  color: var(--fg-1);\n}\n\n/* In-body all-caps subhead (per brand spec) */\n.subhead-caps {\n  font-family: var(--font-display);\n  font-weight: var(--w-medium);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-caps);\n  font-size: var(--t-caption);\n  color: var(--fg-2);\n}\n\n/* Body copy — light weight, 12 words/line max guidance */\np, .body {\n  font-family: var(--font-body);\n  font-weight: var(--w-light);\n  font-size: var(--t-body);\n  line-height: var(--lh-normal);\n  color: var(--fg-1);\n  max-width: 60ch;          /* ~12 words/line */\n  text-wrap: pretty;\n  margin: 0 0 1em 0;\n}\n.body-lg { font-size: var(--t-body-lg); line-height: var(--lh-loose); }\n.body-sm { font-size: var(--t-body-sm); line-height: var(--lh-normal); }\n\n.eyebrow {\n  font-family: var(--font-display);\n  font-weight: var(--w-medium);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-caps);\n  font-size: var(--t-eyebrow);\n  color: var(--fg-2);\n}\n\na {\n  color: var(--link);\n  text-decoration: underline;\n  text-underline-offset: 3px;\n  text-decoration-thickness: 1px;\n  transition: color var(--dur-fast) var(--ease-out);\n}\na:hover { color: var(--accent); text-decoration-thickness: 2px; }\n\ncode, pre, .mono {\n  font-family: var(--font-mono);\n  font-size: 0.92em;\n}\n\n::selection { background: var(--signal-red); color: var(--fog); }\n\n/* Reusable utility — Celestial gradient text */\n.gradient-text {\n  background: var(--celestial-gradient);\n  -webkit-background-clip: text;\n          background-clip: text;\n  -webkit-text-fill-color: transparent;\n          color: transparent;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   PR Measurement landing page — Signal AI\n   Built on colors_and_type.css tokens\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\n.pr-page {\n  background: var(--bg);\n  color: var(--warm-black);\n  font-family: var(--font-body);\n  font-weight: 300;\n  overflow-x: hidden;\n}\n.pr-page img { display: block; }\n\n.wrap { max-width: 1200px; margin: 0 auto; padding: 0 40px; }\n\n.eyebrow-line {\n  display: inline-flex; align-items: center; gap: 10px;\n  font-family: var(--font-display); font-weight: 500;\n  text-transform: uppercase; letter-spacing: 0.12em;\n  font-size: 12px; color: var(--digitalis);\n}\n.eyebrow-line::before {\n  content: ''; width: 26px; height: 1.5px; background: currentColor;\n}\n.eyebrow-line.center { justify-content: center; }\n\n/* ---------- Buttons ---------- */\n.btn {\n  display: inline-flex; align-items: center; justify-content: reputation and how big a media impact. Dive deeper into any competitive or topic-related insights relevant to strategic priorities.<\u002Fp>\n        <a class=\"explore\" href=\"https://signal-ai.com/solutions/reports/\">Explore here <i class=\"ico\" data-lucide=\"arrow-right\"><\u002Fi><\u002Fa>\n      <\u002Fdiv>\n      <div class=\"sol-card\">\n        <div class=\"kicker\">C-suite-ready insights at your fingertips<\u002Fdiv>\n        <h3>C-suite-ready Executive Briefings<\u002Fh3>\n        <p>Signal AI's Executive Briefings, Newsletters, and Reputation Reports are built for decision-makers. They cut through the methodology and deliver the narrative the C-suite needs — clearly, credibly, and on time.<\u002Fp>\n        <a class=\"explore\" href=\"https://signal-ai.com/solutions/newsletters/\">Explore here <i class=\"ico\" data-lucide=\"arrow-right\"><\u002Fi><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"sol-foot\">Not finding what you're looking for? <a href=\"http://signal-ai.com/contact-us\">Get in touch here.<\u002Fa><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== DIFFERENTIATORS ============== -->\n<section class=\"diff wrap\" data-screen-label=\"Why different\">\n  <div class=\"section-head-center\">\n    <div class=\"eyebrow-line center\">The difference<\u002Fdiv>\n    <h2 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(32px,3.6vw,48px);line-height:1.04;letter-spacing:-0.03em;margin:14px 0 0;max-width:18ch;text-wrap:balance;\">Why Signal AI's decision intelligence is different<\u002Fh2>\n  <\u002Fdiv>\n  <div class=\"diff-grid\">\n    <div class=\"diff-col\">\n      <div class=\"ico-wrap\"><i class=\"ico\" data-lucide=\"zap\"><\u002Fi><\u002Fdiv>\n      <h3>Speed to insight<\u002Fh3>\n      <p>Signal AI's world-class and real-time data and intelligence can be accessed through natural language prompts, data APIs, <a href=\"https://signal-ai.com/solutions/ask-aiq/\">intelligent agents<\u002Fa>, and intuitive workflows.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"diff-col\">\n      <div class=\"ico-wrap\"><i class=\"ico\" data-lucide=\"target\"><\u002Fi><\u002Fdiv>\n      <h3>Reliability &amp; accuracy<\u002Fh3>\n      <p>Our AIQ engine can ingest a breadth and depth of insight from our <a href=\"https://signal-ai.com/approach/data-powering-global-insight/\">global dataset<\u002Fa>, including traditional media, social media, broadcast, podcast, regulatory filings, and alternative data. DeepL translation coverage means never missing a mention, across 120+ languages.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"diff-col\">\n      <div class=\"ico-wrap\"><i class=\"ico\" data-lucide=\"layers\"><\u002Fi><\u002Fdiv>\n      <h3>More than a decade of AI innovation &amp; expertise<\u002Fh3>\n      <p>Our solutions are built on an AI-native foundation yet are AI-powered but human-led, leveraging the expertise of in-house analysts. Decision intelligence means empowering you to take action and make more informed &amp; confident decisions.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"diff-foot\">\n    <a class=\"btn btn-dark\" href=\"https://signal-ai.com/approach/\">Learn more about our approach <i class=\"ico\" data-lucide=\"arrow-right\"><\u002Fi><\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== TESTIMONIALS ============== -->\n<section class=\"testi\" data-screen-label=\"Testimonials\">\n  <div class=\"wrap\">\n    <div class=\"section-head-center\">\n      <div class=\"eyebrow-line center\">Customer stories<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(32px,3.6vw,48px);line-height:1.04;letter-spacing:-0.03em;margin:14px 0 0;\">What our customers say<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"testi-grid\">\n      <div class=\"testi-col\">\n        <div class=\"testi-card feat\">\n          <div class=\"mark\">\"<\u002Fdiv>\n          <blockquote>Signal AI's reporting is an invaluable strategic tool for us. After seeing 20+ years of ill-thought-through PR reports put in front of executives, I can firmly say we have a reporting mechanism with Signal AI that's seen as truly strategic across the business. Our key stakeholders recognize the value of Signal AI's insights and actively promote them across the management team, underlining the strategic value of communications when it comes to tracking and understanding our industry reputation.<\u002Fblockquote>\n          <div class=\"who\">\n            <div class=\"av\">MC<\u002Fdiv>\n            <div class=\"meta\"><b>Matt Cross<\u002Fb><span>Head of Strategy and External Comms, Dentsu<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"testi-col\">\n        <div class=\"testi-card\">\n          <div class=\"mark\">\"<\u002Fdiv>\n          <blockquote>Signal AI's ability to process and analyze global media sources in real-time provides us with crucial, context-rich insights.<\u002Fblockquote>\n          <div class=\"who\">\n            <div class=\"av\">KA<\u002Fdiv>\n            <div class=\"meta\"><b>Kai Akram<\u002Fb><span>Head of Media, Amnesty International UK<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"testi-card\">\n          <div class=\"mark\">\"<\u002Fdiv>\n          <blockquote>We're big fans of Signal AI because of how it helps us be more effective communicators. We use the visualization tools to put information that tells a compelling story in front of our leadership. And critically, we use the data to help understand how our key messages and thought leadership themes are performing.<\u002Fblockquote>\n          <div class=\"who\">\n            <div class=\"av\">PM<\u002Fdiv>\n            <div class=\"meta\"><b>Patrick MacElroy<\u002Fb><span>Senior Director of Communications, Black &amp; Veatch<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== RESOURCES ============== -->\n<section class=\"res wrap\" data-screen-label=\"Resources\">\n  <div class=\"section-head-center\">\n    <div class=\"eyebrow-line center\">Resources<\u002Fdiv>\n    <h2 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(32px,3.6vw,48px);line-height:1.04;letter-spacing:-0.03em;margin:14px 0 0;\">Go deeper on PR measurement<\u002Fh2>\n  <\u002Fdiv>\n  <div class=\"res-grid\">\n    <a class=\"res-card\" href=\"https://signal-ai.com/insights/resource/register-now-managing-a-world-class-measurement-program-at-a-fortune-500-company/\">\n      <div class=\"res-thumb g1\"><i class=\"ico\" data-lucide=\"presentation\"><\u002Fi><\u002Fdiv>\n      <div class=\"res-body\">\n        <span class=\"res-tag\">Webinar<\u002Fspan>\n        <h3>Leading a World-Class Measurement Program at a Fortune 500 Company<\u002Fh3>\n        <p>Nicholle Manners, VP of Communications Intelligence at Prudential Financial, and Stacy Ries, VP of Global Communications at SAP, explore how to leverage PR measurement and analytics to drive impactful communications strategies that are indispensable to senior stakeholders.<\u002Fp>\n        <span class=\"go\">Watch now <i class=\"ico\" data-lucide=\"arrow-right\"><\u002Fi><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fa>\n    <a class=\"res-card\" href=\"https://signal-ai.com/insights/what-your-c-suite-really-wants-the-5-cs-of-reporting-best-practices/\">\n      <div class=\"res-thumb g2\"><i class=\"ico\" data-lucide=\"file-text\"><\u002Fi><\u002Fdiv>\n      <div class=\"res-body\">\n        <span class=\"res-tag\">Blog<\u002Fspan>\n        <h3>What Your C-Suite Really Wants: The 5 C's of Media Reporting<\u002Fh3>\n        <p>Your media monitoring dashboard could show impressive numbers: millions in reach, hundreds of mentions. You present them to executive leadership or the Board with confidence, but you're met with blank stares. The problem isn't your results, it's how you're reporting them.<\u002Fp>\n        <span class=\"go\">Read article <i class=\"ico\" data-lucide=\"arrow-right\"><\u002Fi><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fa>\n    <a class=\"res-card\" href=\"https://signal-ai.com/insights/redefining-pr-measurement-with-evan-escobedo/\">\n      <div class=\"res-thumb g3\"><i class=\"ico\" data-lucide=\"mic\"><\u002Fi><\u002Fdiv>\n      <div class=\"res-body\">\n        <span class=\"res-tag\">Podcast<\u002Fspan>\n        <h3>Redefining PR Measurement, with Evan Escobedo<\u002Fh3>\n        <p>In this episode, we sit down with Evan Escobedo, a PR innovator and founder of measuredPR, who developed the Media Impact Scoring Model at Western Union.<\u002Fp>\n        <span class=\"go\">Listen now <i class=\"ico\" data-lucide=\"arrow-right\"><\u002Fi><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== DEMO CTA ============== -->\n<section class=\"demo\" data-screen-label=\"Demo CTA\">\n  <div class=\"demo-inner\">\n    <img class=\"pyr\" src=\"41f1ac17-1376-4eb9-9013-336140c7aac0\" alt=\"\">\n    <h2>Ready to prove what PR is actually worth?<\u002Fh2>\n    <p>See how Signal AI transforms coverage data into boardroom-ready proof of impact.<\u002Fp>\n    <div class=\"demo-cta\">\n      <a class=\"btn btn-light\">Request a demo <i class=\"ico\" data-lucide=\"arrow-right\"><\u002Fi><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== FAQ ============== -->\n<section class=\"faq wrap\" data-screen-label=\"FAQ\">\n  <div class=\"section-head-center\">\n    <div class=\"eyebrow-line center\">FAQ<\u002Fdiv>\n    <h2 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(32px,3.6vw,48px);line-height:1.04;letter-spacing:-0.03em;margin:14px 0 0;\">PR measurement, answered<\u002Fh2>\n  <\u002Fdiv>\n  <div class=\"faq-grid\">\n    <details class=\"faq-item\">\n      <summary>What is PR measurement, and why does it matter? <span class=\"q-ico\"><i class=\"ico\" data-lucide=\"plus\"><\u002Fi><\u002Fspan><\u002Fsummary>\n      <div class=\"ans\">PR measurement is the process of quantifying the impact of your communications strategy on your business value and brand reputation. It moves beyond counting clips to analyzing how your earned media coverage influences audience sentiment, narrative alignment, and corporate health. Without accurate tracking, communication teams operate in a silo, unable to prove how their campaigns navigate risk or fuel future growth.<\u002Fdiv>\n    <\u002Fdetails>\n    <details class=\"faq-item\">\n      <summary>How do you measure the ROI of public relations (PR)? <span class=\"q-ico\"><i class=\"ico\" data-lucide=\"plus\"><\u002Fi><\u002Fspan><\u002Fsummary>\n      <div class=\"ans\">Measuring PR ROI requires connecting your earned media data directly to your business outcomes or your broader corporate strategy. Instead of relying on arbitrary advertising value equivalents (AVEs), focus on business pipeline metrics, organic website traffic growth, and changes in brand perception scores over time. Tracking your audience's digital touchpoints throughout the buying journey lets you map coverage directly to pipeline revenue.<\u002Fdiv>\n    <\u002Fdetails>\n    <details class=\"faq-item\">\n      <summary>What is a Media Impact Score? <span class=\"q-ico\"><i class=\"ico\" data-lucide=\"plus\"><\u002Fi><\u002Fspan><\u002Fsummary>\n      <div class=\"ans\">A Media Impact Score is a holistic performance metric that builds on multiple qualitative and quantitative data points to evaluate the true resonance of your coverage. Unlike traditional volume counts, this weighted reputation score factors in message pull-through, source authority, publication reach, and entity-level sentiment. This gives communications leaders a clear, benchmarked view of how specific articles shift public opinion.<\u002Fdiv>\n    <\u002Fdetails>\n    <details class=\"faq-item\">\n      <summary>How is share of voice calculated? <span class=\"q-ico\"><i class=\"ico\" data-lucide=\"plus\"><\u002Fi><\u002Fspan><\u002Fsummary>\n      <div class=\"ans\">Traditional share of voice tracking calculates your percentage of media mentions within a specific peer set by dividing your article count by the total industry volume. However, this raw volume model often creates a bias against smaller companies that receive low-volume, high-sentiment coverage. Advanced PR reporting tools now use a proprietary topic association score to measure your true connection to key narratives, regardless of total article count.<\u002Fdiv>\n    <\u002Fdetails>\n    <details class=\"faq-item\">\n      <summary>What should PR reports include for the C-suite? <span class=\"q-ico\"><i class=\"ico\" data-lucide=\"plus\"><\u002Fi><\u002Fspan><\u002Fsummary>\n      <div class=\"ans\"><a href=\"https://signal-ai.com/insights/what-goes-into-a-reputation-report-how-we-help-monitor-measure-reputation-to-elevate-your-strategy/\">Executive-level PR reporting<\u002Fa> needs to skip tactical minutiae and focus on strategic data delivered in a concise, digestible format. Your corporate communications briefs should feature three core components: <b>A reputation scorecard<\u002Fb> tracking performance against universal corporate pillars like innovation, purpose, and financial health; <b>Actionable competitive benchmarking<\u002Fb> that highlights won white spaces and areas where peers are outflanking your brand; and <b>Forward-looking reputation risk intelligence<\u002Fb> to proactively signal narrative anomalies or emerging threats before they impact operations.<\u002Fdiv>\n    <\u002Fdetails>\n    <details class=\"faq-item\">\n      <summary>How can AI help with PR measurement? <span class=\"q-ico\"><i class=\"ico\" data-lucide=\"plus\"><\u002Fi><\u002Fspan><\u002Fsummary>\n      <div class=\"ans\">AI-powered PR analytics <a href=\"https://signal-ai.com/insights/beyond-boolean-why-fortune-500s-lean-on-ai-powered-search/\">eliminate manual Boolean guesswork<\u002Fa> by using natural language processing to read unstructured global data for context. While generative AI excels at instantly summarizing complex datasets into C-suite briefs, discriminative AI categorizes entities, maps hidden thematic connections, and accurately isolates sentiment to specific organizations in a single sentence.<\u002Fdiv>\n    <\u002Fdetails>\n    <details class=\"faq-item\">\n      <summary>What's the difference between media monitoring and PR measurement? <span class=\"q-ico\"><i class=\"ico\" data-lucide=\"plus\"><\u002Fi><\u002Fspan><\u002Fsummary>\n      <div class=\"ans\">Media monitoring is a reactive, binary exercise focused on capturing real-time clips, alerts, and keyword mentions across various channels. PR measurement is a proactive branch of <a href=\"https://signal-ai.com/guide-to-reputation-management/\">reputation management<\u002Fa> and intelligence. It transforms raw coverage data into structured external intelligence, using advanced data analytics to guide your ongoing narrative planning and corporate storytelling.<\u002Fdiv>\n    <\u002Fdetails>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== FOOTER ============== -->\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\"footer-inner\">\n      <div class=\"brand-blurb\">\n        <div class=\"lockup\"><img src=\"fcf8770a-d39c-4a18-8a3e-e17cffd0e63b\" alt=\"\"><span>Signal AI<\u002Fspan><\u002Fdiv>\n        <p>Reputation and risk intelligence, powered by AI research applied to business since 2013.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h4>Platform<\u002Fh4>\n        <ul><li><a>Reputation<\u002Fa><\u002Fli><li><a>Corporate Risk<\u002Fa><\u002Fli><li><a>AIQ<\u002Fa><\u002Fli><li><a>Briefings<\u002Fa><\u002Fli><li><a>Integrations<\u002Fa><\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h4>Solutions<\u002Fh4>\n        <ul><li><a>For CCOMs<\u002Fa><\u002Fli><li><a>For Risk<\u002Fa><\u002
